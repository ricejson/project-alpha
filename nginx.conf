server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Sensible defaults
    server_tokens off;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml application/xml+rss image/svg+xml;
    gzip_min_length 1024;

    # Security headers
    add_header X-Frame-Options          "SAMEORIGIN" always;
    add_header X-Content-Type-Options   "nosniff" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

    # Container-level health probe (does not require backend)
    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Long cache for hashed Vite assets under /assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback - serve index.html for any non-asset route
    location / {
        try_files $uri $uri/ /index.html;
    }
}