# Fly.io configuration for the project-alpha backend.
# Docs: https://fly.io/docs/reference/configuration/

app = "project-alpha-shilianjie"
primary_region = "hkg"            # Hong Kong — best latency for CN users
kill_signal = "SIGINT"
kill_timeout = "30s"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  APP_ENV = "production"
  HTTP_ADDR = ":8080"

[experimental]
  auto_rollback = true

[[services]]
  protocol = "tcp"
  internal_port = 8080
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "get"
    path = "/healthz"

[metrics]
  port = 8080
  path = "/metrics"
