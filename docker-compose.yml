services:
  postgres:
    image: postgres:16-alpine
    container_name: project-alpha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: project_alpha
      POSTGRES_PASSWORD: project_alpha
      POSTGRES_DB: project_alpha
    ports:
      - "5432:5432"
    volumes:
      - project_alpha_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U project_alpha -d project_alpha"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: project-alpha-backend:latest
    container_name: project-alpha-backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      HTTP_ADDR: ":8080"
      DATABASE_URL: host=postgres user=project_alpha password=project_alpha dbname=project_alpha port=5432 sslmode=disable TimeZone=Asia/Shanghai
      CORS_ALLOWED_ORIGINS: http://localhost:8081
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - app-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    image: project-alpha-frontend:latest
    container_name: project-alpha-frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-net

volumes:
  project_alpha_postgres:

networks:
  app-net:
    driver: bridge
