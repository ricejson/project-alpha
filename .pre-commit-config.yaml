default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: gofmt -w
        language: system
        types: [go]

      - id: go-vet
        name: go vet
        entry: bash -c 'cd backend && go vet ./...'
        language: system
        files: ^backend/.*\.go$
        pass_filenames: false

      - id: go-test
        name: go test
        entry: bash -c 'cd backend && go test ./...'
        language: system
        files: ^backend/.*\.go$
        pass_filenames: false

      - id: frontend-build
        name: frontend build
        entry: bash -c 'cd frontend && npm run build'
        language: system
        files: ^frontend/(src|package\.json|package-lock\.json|tsconfig.*\.json|vite\.config\.ts|tailwind\.config\.ts|postcss\.config\.js|index\.html)
        pass_filenames: false

      - id: frontend-test
        name: frontend test
        entry: bash -c 'cd frontend && npm test'
        language: system
        files: ^frontend/(src|package\.json|package-lock\.json|tsconfig.*\.json|vite\.config\.ts|tailwind\.config\.ts|postcss\.config\.js)
        pass_filenames: false
